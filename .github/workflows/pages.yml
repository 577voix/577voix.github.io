# Publication du site 577 voix sur GitHub Pages.
# Le site est déjà entièrement généré (CT 117) : ce workflow ne construit rien, il publie le dépôt tel quel.
# Nécessite Settings → Pages → Source = « GitHub Actions ».
name: Publication Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
